<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OP Apps Studio | En Construcción</title>
    <meta name="description" content="OP Apps Studio - Desarrollo de aplicaciones y soluciones digitales. Sitio web en construcción.">
    <link rel="canonical" href="https://opappsstudio.com/">
    <script>
        if (window.location.hostname.endsWith('opappsstudio.es')) {
            window.location.replace('https://opappsstudio.com' + window.location.pathname + window.location.search + window.location.hash);
        }
    </script>
    <style>
        :root {
            --bg-primary: #090d16;
            --bg-secondary: #111827;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --card-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 1.5rem;
        }

        /* Ambient background glows */
        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(110px);
            opacity: 0.25;
            z-index: 0;
            pointer-events: none;
            animation: float 10s ease-in-out infinite alternate;
        }

        .glow-1 {
            width: 420px;
            height: 420px;
            background: var(--accent-primary);
            top: -120px;
            left: -100px;
        }

        .glow-2 {
            width: 380px;
            height: 380px;
            background: var(--accent-secondary);
            bottom: -100px;
            right: -80px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 20px) scale(1.08); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            width: 100%;
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3.5rem 2.5rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 1rem;
            border-radius: 9999px;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.25);
            color: #60a5fa;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            margin-bottom: 1.75rem;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #60a5fa;
            box-shadow: 0 0 10px #60a5fa;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.85); }
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.15;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 0%, #93c5fd 50%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.25rem;
        }

        .progress-wrapper {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .progress-bar {
            width: 65%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 999px;
            position: relative;
            overflow: hidden;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2.2s infinite;
        }

        @keyframes shimmer {
            100% { left: 100%; }
        }

        .footer {
            font-size: 0.85rem;
            color: rgba(156, 163, 175, 0.7);
            border-top: 1px solid var(--card-border);
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <main class="container">
        <div class="badge">
            <span class="pulse-dot"></span>
            En Construcción
        </div>

        <h1>OP Apps Studio</h1>

        <p>
            Estamos preparando nuestra nueva plataforma digital y nuestras próximas aplicaciones. Muy pronto estaremos en línea.
        </p>

        <div class="progress-wrapper" aria-label="Progreso de construcción">
            <div class="progress-bar"></div>
        </div>

        <footer class="footer">
            &copy; <span id="year"></span> OP Apps Studio. Todos los derechos reservados.
        </footer>
    </main>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
